services:
  app_in:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_in_bot_gateway
    env_file:
      - .env                    # 所有金鑰集中在此，不進 image
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"